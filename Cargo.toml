[package]
name = "symbol_to_source_resolver"
version = "0.1.0"
edition = "2024"

[dependencies]
cargo_metadata = "0.23"
syn = { version = "3", features = ["full", "visit"] }
fsscanner = { git = "https://github.com/witold-k/fsscanner", rev = "cb034d15865d20b5102c6ec5a12f8944e2e11058" }

tree-sitter = "0.27"
tree-sitter-java = "0.23"
tree-sitter-rust = "0.24"

tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
serde_json = "1"
